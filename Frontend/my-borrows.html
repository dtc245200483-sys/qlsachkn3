<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lịch sử mượn — Thư viện ICTU AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20260810-12">
</head>
<body data-page="my-borrows">
  <header class="app-header" id="app-header-root"></header>

  <main class="page">
    <div id="page-message" class="alert" hidden></div>

    <div class="toolbar">
      <button type="button" id="clear-history-button" class="btn btn-danger">Xoá toàn bộ lịch sử</button>
    </div>

    <div id="loading" class="loading" hidden>
      <span class="spinner"></span>
      <span>Đang tải dữ liệu...</span>
    </div>

    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Mã phiếu</th>
            <th>Mã bản sách (Copy ID)</th>
            <th>Sách</th>
            <th>Ngày mượn</th>
            <th>Hạn trả</th>
            <th>Ngày trả</th>
            <th>Trạng thái</th>
            <th>Điểm phạt</th>
            <th>Thao tác</th>
          </tr>
        </thead>
        <tbody id="history-tbody"></tbody>
      </table>
    </div>
  </main>

  <footer class="site-footer">
    <img class="logo logo--footer" src="assets/cropped-logoww.png" alt="Logo ICTU" onerror="this.style.display='none'">
    <span>Hệ thống quản lý thư viện tích hợp AI — Trường ĐH CNTT &amp; Truyền thông</span>
  </footer>

  <script src="js/api.js?v=20260810-8"></script>
  <script src="js/auth.js?v=20260809-14"></script>
  <script src="js/layout.js?v=20260810-3"></script>
  <script>window.Layout.init("my-borrows");</script>
  <script src="js/notifications-core.js?v=20260810-5"></script>
  <script src="js/notif-badge.js?v=20260809-7"></script>
  <script src="js/my-borrows.js?v=20260809-7"></script>
</body>
</html>
