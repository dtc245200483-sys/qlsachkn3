<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý sách — Hệ thống quản lý thư viện AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20260915-01">
</head>
<body>
  <header class="app-header" id="app-header-root"></header>

  <main class="page">
    <div id="page-message" class="alert" hidden></div>

    <div class="toolbar">
      <div class="form-group">
        <label for="book-sort">Sắp xếp theo</label>
        <select id="book-sort">
          <option value="">Mặc định</option>
          <option value="ten_asc">Tên sách (A-Z)</option>
          <option value="ten_desc">Tên sách (Z-A)</option>
          <option value="tacGia_asc">Tác giả (A-Z)</option>
          <option value="namXb_desc">Năm XB (mới nhất)</option>
          <option value="namXb_asc">Năm XB (cũ nhất)</option>
          <option value="soLuong_desc">Số lượng (nhiều nhất)</option>
          <option value="soLuong_asc">Số lượng (ít nhất)</option>
        </select>
      </div>
      <button type="button" id="add-book-button" class="btn btn-primary" data-roles="librarian,admin" hidden>
        + Thêm sách
      </button>
    </div>

    <div id="loading" class="loading" hidden>
      <span class="spinner"></span>
      <span>Đang tải dữ liệu...</span>
    </div>

    <div class="book-list-wrap"><div id="book-list-container" class="book-list-view"></div></div>
    <div id="pagination-controls" class="pagination"></div>
  </main>

  <div id="book-modal" class="modal-overlay" hidden>
    <div class="modal-box">
      <h2 id="book-form-title">Thêm sách</h2>
      <form id="book-form" novalidate>
        <div class="form-grid">
          <div class="form-group">
            <label for="book-ma">Mã sách</label>
            <input type="text" id="book-ma" name="ma" required>
          </div>
          <div class="form-group">
            <label for="book-ten">Tên sách</label>
            <input type="text" id="book-ten" name="ten" required>
          </div>
          <div class="form-group">
            <label for="book-tacgia">Tác giả</label>
            <input type="text" id="book-tacgia" name="tacGia" required>
          </div>
          <div class="form-group">
            <label for="book-theloai">Thể loại</label>
            <select id="book-theloai" name="theLoai" required>
              <option value="">-- Chọn thể loại --</option>
            </select>
          </div>
          <div class="form-group">
            <label for="book-nxb">Nhà xuất bản</label>
            <select id="book-nxb" name="nxb" required>
              <option value="">-- Chọn NXB --</option>
            </select>
          </div>
          <div class="form-group">
            <label for="book-namxb">Năm xuất bản</label>
            <input type="number" id="book-namxb" name="namXb" min="1000" max="2100" required>
          </div>
          <div class="form-group">
            <label for="book-soluong">Số lượng</label>
            <input type="number" id="book-soluong" name="soLuong" min="0" required>
          </div>
          <div class="form-group">
            <label for="book-anhbia">URL Ảnh bìa</label>
            <input type="text" id="book-anhbia" name="anhBia" placeholder="Ví dụ: img/sach1.jpg hoặc https://...">
            <div id="cover-drop-zone" style="margin-top: 8px; padding: 20px; border: 2px dashed #cbd5e1; border-radius: 8px; text-align: center; color: #64748b; cursor: pointer; transition: all 0.2s ease; background-color: #f8fafc;">
              <span id="cover-drop-text">Kéo thả hoặc nhấp để tải ảnh lên (tối đa 5MB)</span>
              <input type="file" id="book-anhbia-file" accept="image/png, image/jpeg, image/webp" style="display: none;">
            </div>
            <div id="cover-upload-status" style="margin-top: 4px; font-size: 13px; color: #3b82f6;"></div>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" id="cancel-book-button" class="btn btn-secondary">Huỷ</button>
          <button type="submit" id="save-book-button" class="btn btn-primary">Lưu</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="site-footer">
    <img class="logo logo--footer" src="assets/cropped-logoww.png" alt="Logo ICTU" onerror="this.style.display='none'">
    <span>Hệ thống quản lý thư viện tích hợp AI — Trường ĐH CNTT &amp; Truyền thông</span>
  </footer>

  <script src="js/api.js?v=20260915-01"></script>
  <script src="js/auth.js?v=20260809-14"></script>
  <script src="js/layout.js?v=20260827-04"></script>
  <script>window.Layout.init("books");</script>
  <script src="js/books.js?v=20260915-01"></script>
</body>
</html>
