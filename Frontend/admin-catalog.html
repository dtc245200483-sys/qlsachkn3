<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh mục — Thư viện ICTU AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20260810-12">
</head>
<body data-page="admin-catalog">
  <header class="app-header" id="app-header-root"></header>

  <main class="page">
    <div id="page-message" class="alert" hidden></div>

    <div class="card">
      <h2>Thể loại</h2>
      <div class="toolbar">
        <button type="button" id="add-category-button" class="btn btn-primary">+ Thêm thể loại</button>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr><th>Mã</th><th>Tên</th><th>Thao tác</th></tr>
          </thead>
          <tbody id="category-tbody"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h2>Nhà xuất bản</h2>
      <div class="toolbar">
        <button type="button" id="add-publisher-button" class="btn btn-primary">+ Thêm NXB</button>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr><th>Mã</th><th>Tên</th><th>Thao tác</th></tr>
          </thead>
          <tbody id="publisher-tbody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <div id="catalog-modal" class="modal-overlay" hidden>
    <div class="modal-box">
      <h2 id="catalog-form-title">Thêm</h2>
      <form id="catalog-form" novalidate>
        <div class="form-group">
          <label for="catalog-ma">Mã</label>
          <input type="text" id="catalog-ma" maxlength="20" required>
        </div>
        <div class="form-group">
          <label for="catalog-ten">Tên</label>
          <input type="text" id="catalog-ten" maxlength="255" required>
        </div>
        <div class="modal-actions">
          <button type="button" id="cancel-catalog-button" class="btn btn-secondary">Huỷ</button>
          <button type="submit" id="save-catalog-button" class="btn btn-primary">Lưu</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="site-footer">
    <img class="logo logo--footer" src="assets/cropped-logoww.png" alt="Logo ICTU" onerror="this.style.display='none'">
    <span>Hệ thống quản lý thư viện tích hợp AI — Trường ĐH CNTT &amp; Truyền thông</span>
  </footer>

  <script src="js/api.js?v=20260810-8"></script>
  <script src="js/auth.js?v=20260809-14"></script>
  <script src="js/layout.js?v=20260810-3"></script>
  <script>window.Layout.init("admin-catalog");</script>
  <script src="js/admin-catalog.js?v=20260809-2"></script>
</body>
</html>
