<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh mục — Thư viện ICTU AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20260809-4">
</head>
<body data-page="admin-catalog">
  <header class="app-header">
    <div class="app-header__inner">
      <div class="brand">
        <img class="logo logo--light" src="assets/cropped-logoww.png" alt="Logo ICTU" onerror="this.style.display='none'">
        <strong class="app-title">Danh mục</strong>
      </div>
      <div class="user-info">
        <span id="user-name"></span>
        <span id="user-role" class="role-badge"></span>
        <button type="button" id="logout-button" class="btn btn-secondary">Đăng xuất</button>
      </div>
    </div>
    <nav class="admin-nav" data-roles="admin,librarian,reader" hidden>
      <a href="search.html" data-roles="admin,librarian,reader">Tra cứu sách</a>
      <a href="reservations.html" data-roles="admin,librarian,reader">Đặt trước</a>
      <a href="my-borrows.html" data-roles="reader">Lịch sử mượn</a>
      <a href="requests.html" data-roles="reader,librarian">Yêu cầu</a>
      <a href="notifications.html" data-roles="reader">Thông báo <span class="notif-badge" id="notif-badge" hidden>0</span></a>
      <a href="borrow.html" data-roles="librarian">Mượn / Trả sách</a>
      <a href="books.html" data-roles="librarian">Quản lý sách</a>
      <a href="readers.html" data-roles="admin,librarian">Quản lý độc giả</a>
      <a href="stats.html" data-roles="admin,librarian">Thống kê</a>
      <a href="admin-accounts.html" data-roles="admin">Tài khoản</a>
      <a href="admin-catalog.html" class="active" data-roles="admin">Danh mục</a>
      <a href="admin-config.html" data-roles="admin">Cấu hình</a>
    </nav>
  </header>

  <main class="page">
    <div id="page-message" class="alert" hidden></div>

    <div class="card">
      <h2>Thể loại</h2>
      <div class="toolbar">
        <button type="button" id="add-category-button" class="btn btn-primary">+ Thêm thể loại</button>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr><th>Mã</th><th>Tên</th><th>Thao tác</th></tr>
          </thead>
          <tbody id="category-tbody"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h2>Nhà xuất bản</h2>
      <div class="toolbar">
        <button type="button" id="add-publisher-button" class="btn btn-primary">+ Thêm NXB</button>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr><th>Mã</th><th>Tên</th><th>Thao tác</th></tr>
          </thead>
          <tbody id="publisher-tbody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <div id="catalog-modal" class="modal-overlay" hidden>
    <div class="modal-box">
      <h2 id="catalog-form-title">Thêm</h2>
      <form id="catalog-form" novalidate>
        <div class="form-group">
          <label for="catalog-ma">Mã</label>
          <input type="text" id="catalog-ma" maxlength="20" required>
        </div>
        <div class="form-group">
          <label for="catalog-ten">Tên</label>
          <input type="text" id="catalog-ten" maxlength="255" required>
        </div>
        <div class="modal-actions">
          <button type="button" id="cancel-catalog-button" class="btn btn-secondary">Huỷ</button>
          <button type="submit" id="save-catalog-button" class="btn btn-primary">Lưu</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="site-footer">
    <img class="logo logo--footer" src="assets/cropped-logoww.png" alt="Logo ICTU" onerror="this.style.display='none'">
    <span>Hệ thống quản lý thư viện tích hợp AI — Trường ĐH CNTT &amp; Truyền thông</span>
  </footer>

  <script src="js/api.js?v=20260810-4"></script>
  <script src="js/auth.js?v=20260809-14"></script>
  <script src="js/admin-catalog.js?v=20260809-2"></script>
</body>
</html>
