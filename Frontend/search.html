<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tra cứu sách — Thư viện ICTU AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20260915-01">
</head>
<body data-page="search">
  <header class="app-header" id="app-header-root"></header>

  <main class="page">
    <div id="page-message" class="alert" hidden></div>

    <div class="search-bar">
      <div class="form-group">
        <label for="search-q">Tìm theo tên / tác giả</label>
        <input type="text" id="search-q" placeholder="Nhập tên sách hoặc tên tác giả...">
      </div>
      <div class="form-group">
        <label for="search-theloai">Thể loại</label>
        <select id="search-theloai">
          <option value="">Tất cả thể loại</option>
        </select>
      </div>
      <div class="form-group">
        <label for="search-trangthai">Trạng thái</label>
        <select id="search-trangthai">
          <option value="">Tất cả</option>
          <option value="con">Còn sách</option>
          <option value="het">Hết sách</option>
          <option value="dang_muon">Đang mượn</option>
        </select>
      </div>
      <div class="form-group">
        <label for="search-sort">Sắp xếp theo</label>
        <select id="search-sort">
          <option value="">Mặc định</option>
          <option value="ten_asc">Tên sách (A-Z)</option>
          <option value="ten_desc">Tên sách (Z-A)</option>
          <option value="tacGia_asc">Tác giả (A-Z)</option>
          <option value="namXb_desc">Năm XB (mới nhất)</option>
          <option value="namXb_asc">Năm XB (cũ nhất)</option>
          <option value="soLuong_desc">Số lượng (nhiều nhất)</option>
          <option value="soLuong_asc">Số lượng (ít nhất)</option>
        </select>
      </div>
      <button type="button" id="search-button" class="btn btn-primary">Tìm</button>
      <button type="button" id="clear-search-button" class="btn btn-secondary">Xoá lọc</button>
      <a href="chatbot.html" class="btn" style="background:linear-gradient(135deg, #0a2e5c 0%, #1e4b8c 100%); color:#fff; display:inline-flex; align-items:center; gap:6px; text-decoration:none; font-weight:600;">🤖 Hỏi Trợ lý AI</a>
    </div>

    <div id="loading" class="loading" hidden>
      <span class="spinner"></span>
      <span>Đang tải dữ liệu...</span>
    </div>

    <div class="book-list-wrap"><div id="book-list-container" class="book-list-view"></div></div>
    <div id="pagination-controls" class="pagination"></div>
  </main>

  <footer class="site-footer">
    <img class="logo logo--footer" src="assets/cropped-logoww.png" alt="Logo ICTU" onerror="this.style.display='none'">
    <span>Hệ thống quản lý thư viện tích hợp AI — Trường ĐH CNTT &amp; Truyền thông</span>
  </footer>

  <script src="js/api.js?v=20260915-01"></script>
  <script src="js/auth.js?v=20260809-14"></script>
  <script src="js/layout.js?v=20260827-04"></script>
  <script>window.Layout.init("search");</script>
  <script src="js/notifications-core.js?v=20260827-04"></script>
  <script src="js/notif-badge.js?v=20260809-7"></script>
  <script src="js/search.js?v=20260915-01"></script>
</body>
</html>
