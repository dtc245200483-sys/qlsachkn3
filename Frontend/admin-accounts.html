<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý tài khoản — Thư viện ICTU AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20260810-12">
</head>
<body data-page="admin-accounts">
  <header class="app-header" id="app-header-root"></header>

  <main class="page">
    <div id="page-message" class="alert" hidden></div>

    <div class="search-bar">
      <div class="form-group">
        <label for="account-role-filter">Lọc theo vai trò</label>
        <select id="account-role-filter">
          <option value="">Tất cả</option>
          <option value="librarian">Thủ thư</option>
          <option value="reader">Độc giả</option>
        </select>
      </div>
      <button type="button" id="apply-account-filter" class="btn btn-primary">Tải lại</button>
      <button type="button" id="add-account-button" class="btn btn-primary">+ Tạo tài khoản</button>
    </div>

    <div id="loading" class="loading" hidden>
      <span class="spinner"></span>
      <span>Đang tải dữ liệu...</span>
    </div>

    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Họ tên</th>
            <th>Role</th>
            <th>Mã độc giả</th>
            <th>Trạng thái</th>
            <th>Ngày tạo</th>
            <th>Thao tác</th>
          </tr>
        </thead>
        <tbody id="account-tbody"></tbody>
      </table>
    </div>
  </main>

  <div id="account-modal" class="modal-overlay" hidden>
    <div class="modal-box">
      <h2 id="account-form-title">Tạo tài khoản</h2>
      <form id="account-form" novalidate>
        <div class="form-grid">
          <div class="form-group">
            <label for="account-username">Username</label>
            <input type="text" id="account-username" name="username" minlength="3" maxlength="50" autocomplete="off" required>
          </div>
          <div class="form-group">
            <label for="account-role">Vai trò</label>
            <select id="account-role" name="role" required>
              <option value="librarian">Thủ thư</option>
            </select>
          </div>
          <div class="form-group">
            <label for="account-password">Mật khẩu (≥ 6 ký tự)</label>
            <input type="password" id="account-password" name="password" minlength="6" maxlength="128" autocomplete="new-password">
          </div>
          <div class="form-group">
            <label for="account-email">Email</label>
            <input type="email" id="account-email" name="email" maxlength="255" autocomplete="off" required>
          </div>
          <div class="form-group">
            <label for="account-sdt">Số điện thoại</label>
            <input type="text" id="account-sdt" name="soDienThoai" maxlength="20" autocomplete="off" required>
          </div>
          <div class="form-group" id="account-reader-group" hidden>
            <label for="account-reader-id">Mã độc giả (nếu role = độc giả)</label>
            <input type="text" id="account-reader-id" name="readerId" maxlength="20" autocomplete="off">
          </div>
          <div class="form-group">
            <label for="account-hoten">Họ tên</label>
            <input type="text" id="account-hoten" name="hoTen" maxlength="255" required>
          </div>
          <div class="form-group checkbox-group">
            <label>
              <input type="checkbox" id="account-active" name="isActive" checked>
              Tài khoản hoạt động
            </label>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" id="cancel-account-button" class="btn btn-secondary">Huỷ</button>
          <button type="submit" id="save-account-button" class="btn btn-primary">Lưu</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="site-footer">
    <img class="logo logo--footer" src="assets/cropped-logoww.png" alt="Logo ICTU" onerror="this.style.display='none'">
    <span>Hệ thống quản lý thư viện tích hợp AI — Trường ĐH CNTT &amp; Truyền thông</span>
  </footer>

  <script src="js/api.js?v=20260810-8"></script>
  <script src="js/auth.js?v=20260809-14"></script>
  <script src="js/layout.js?v=20260810-3"></script>
  <script>window.Layout.init("admin-accounts");</script>
  <script src="js/admin-accounts.js?v=20260810-4"></script>
</body>
</html>
